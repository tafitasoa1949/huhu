; Firmware du contrôleur moteur — Personne 3.
;
; Deux environnements :
;   esp32dev : le firmware réel, à téléverser sur la carte.
;   native   : compilation sur PC des modules sans dépendance matérielle
;              (protocole, mélangeur de direction, arbitrage de sécurité),
;              pour exécuter les tests sans ESP32 ni voiture.
;
;   pio run                 compile le firmware
;   pio test -e native      exécute les tests sur PC
;   pio run -t upload       téléverse
;   pio device monitor      ouvre le moniteur série

[platformio]
default_envs = esp32dev

[env]
; Version 6 volontairement : StaticJsonDocument alloue sur la pile, là où le
; JsonDocument de la version 7 passe par le tas. Dans une boucle de contrôle
; qui tourne en continu, éviter le tas évite la fragmentation.
lib_deps = bblanchon/ArduinoJson@^6.21.5
build_flags = -Wall -Wextra
test_build_src = yes

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Les tests tournent en natif, il n'y a rien à exécuter sur la carte.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -I include
; Seuls les modules indépendants du matériel sont compilés sur PC :
; main.cpp, motor_controller.cpp et sensors.cpp incluent Arduino.h.
build_src_filter = +<communication.cpp> +<steering_controller.cpp> +<safety.cpp>
