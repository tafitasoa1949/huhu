[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; huge_app.csv : le firmware (WiFi + esp_http_server + pile caméra) dépasse
; la partition "app" par défaut, pensée pour des croquis Arduino simples.
board_build.partitions = huge_app.csv

; Le module AI-Thinker ESP32-CAM a 4 Mo de PSRAM, indispensables pour les
; tampons JPEG en double buffering (CAM_FB_COUNT = 2 dans cam_config.h).
; -mfix-esp32-psram-cache-issue corrige une erratum de cache connue sur les
; premières révisions du silicium ESP32 quand la PSRAM est active.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue