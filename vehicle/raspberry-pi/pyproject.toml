[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-car"
version = "0.1.0"
description = "Voiture connectée — vision, sécurité, contrôle moteur et serveur P2P (docs/architecture.md)."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "gpiozero>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
vision = [
    "opencv-python>=4.8",
]

[project.scripts]
smart-car-server = "smart_car.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
