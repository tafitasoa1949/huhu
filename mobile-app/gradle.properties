org.gradle.jvmargs=-Xmx2048m
kotlin.code.style=official

# "app" applique le plugin Android et a besoin du SDK Android pour se
# configurer ; "core" est du Kotlin/JVM pur. La configuration à la demande
# permet de lancer `gradle :core:test` sans que Gradle configure "app", donc
# sans exiger un SDK Android installé pour travailler sur le protocole seul.
org.gradle.configureondemand=true

android.useAndroidX=true
